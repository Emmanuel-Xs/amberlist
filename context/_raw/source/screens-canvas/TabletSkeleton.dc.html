<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home loading, tablet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zen/tokens.css">
<link rel="stylesheet" href="ds/zen/components/bundle.css">
<script src="ds/zen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="dark" style="width: 820px; height: 1180px; display: flex; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<x-import component-from-global-scope="Zen.AppNav" layout="rail" active="home" items="{{items}}" style="height: 1180px; flex-shrink: 0"></x-import>
<main aria-busy="true" aria-label="Loading your day" style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 10px"><x-import component-from-global-scope="Zen.Skeleton" width="160px" height="14px"></x-import><x-import component-from-global-scope="Zen.Skeleton" width="340px" height="30px" radius="10px"></x-import></div>
<x-import component-from-global-scope="Zen.Skeleton" width="48px" height="48px" radius="50%"></x-import>
</div>
<x-import component-from-global-scope="Zen.Skeleton" width="100%" height="52px" radius="9999px"></x-import>
<x-import component-from-global-scope="Zen.Skeleton" width="100%" height="56px" radius="9999px"></x-import>
<div style="display: flex; justify-content: space-between"><sc-for list="{{seven}}" as="d" hint-placeholder-count="7"><x-import component-from-global-scope="Zen.Skeleton" width="56px" height="64px" radius="9999px"></x-import></sc-for></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px"><sc-for list="{{four}}" as="c" hint-placeholder-count="4"><x-import component-from-global-scope="Zen.Skeleton" width="100%" height="188px" radius="28px"></x-import></sc-for></div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return { seven: [1,2,3,4,5,6,7], four: [1,2,3,4], items: [
      { id: 'home', label: 'Home', icon: 'home', href: 'TabletHome.dc.html' },
      { id: 'tasks', label: 'Tasks', icon: 'tasks', href: 'TabletTasks.dc.html' },
      { id: 'notes', label: 'Notes', icon: 'note', href: 'TabletNotes.dc.html' },
      { id: 'habits', label: 'Habits', icon: 'flame' },
      { id: 'folders', label: 'Folders', icon: 'folder' }
    ] };
  }
}
</script>
</body>
</html>
