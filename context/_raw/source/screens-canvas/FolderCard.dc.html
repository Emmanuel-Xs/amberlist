<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Folder card</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zen/tokens.css">
<link rel="stylesheet" href="ds/zen/components/bundle.css">
<script src="ds/zen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: {{wpx}}; height: 160px; flex-shrink: 0; display: flex; flex-direction: column; font-family: var(--font-sans); color: var(--on-pastel)">
<div style="width: 50%; height: 16px; flex-shrink: 0; border-radius: 12px 12px 0 0; background: {{bg}}; filter: brightness(0.88)"></div>
<a href="#" aria-label="Open {{heading}} folder, {{count}} tasks" style="flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; border-radius: 0 20px 20px 20px; background: {{bg}}; color: var(--on-pastel); text-decoration: none">
<div style="display: flex; justify-content: space-between; align-items: flex-start">
<x-import component-from-global-scope="Zen.Icon" name="{{icon}}" size="{{s26}}"></x-import>
<span style="font-size: 12px; line-height: 16px; font-weight: 600; padding: 2px 8px; border-radius: 9999px; background: rgba(28,29,33,0.1)">{{count}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 15px; line-height: 20px; font-weight: 600">{{heading}}</span>
<div style="display: flex; align-items: center; gap: 8px">
<div style="flex-grow: 1; height: 6px; border-radius: 9999px; background: rgba(28,29,33,0.14); overflow: hidden">
<div style="width: {{pct}}; height: 100%; border-radius: 9999px; background: var(--on-pastel)"></div>
</div>
<span style="font-size: 11px; line-height: 14px; font-weight: 500; white-space: nowrap">{{doneLabel}}</span>
</div>
</div>
</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tone":{"editor":"enum","options":["lavender","butter","mint","peach","sky"],"default":"butter"},"heading":{"editor":null,"default":"Work"},"count":{"editor":null,"default":6},"done":{"editor":null,"default":2},"icon":{"editor":null,"default":"folder"},"w":{"editor":null,"default":200},"$preview":{"width":200,"height":160}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const count = Number(p.count ?? 6), done = Number(p.done ?? 2);
    return {
      s26: 26,
      wpx: Number(p.w ?? 200) + 'px',
      bg: 'var(--' + (p.tone ?? 'butter') + ')',
      heading: p.heading ?? 'Work',
      count: count,
      doneLabel: done + ' of ' + count + ' done',
      pct: (count ? Math.round(done / count * 100) : 0) + '%',
      icon: p.icon ?? 'folder'
    };
  }
}
</script>
</body>
</html>
