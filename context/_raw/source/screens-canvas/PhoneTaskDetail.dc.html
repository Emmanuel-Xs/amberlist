<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task detail, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zen/tokens.css">
<link rel="stylesheet" href="ds/zen/components/bundle.css">
<script src="ds/zen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="dark" style="width: 390px; height: 1400px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 20px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<a href="PhoneTasks.dc.html" aria-label="Back to tasks" style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface); color: var(--ink); display: grid; place-items: center"><x-import component-from-global-scope="Zen.Icon" name="arrowLeft" size="{{s20}}"></x-import></a>
<span style="font-size: 17px; font-weight: 600">Task</span>
<button type="button" aria-label="More actions" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0"><x-import component-from-global-scope="Zen.Icon" name="more" size="{{s20}}"></x-import></button>
</header>
<dc-import name="TodayCard" tone="accent" heading="Submit HNG Stage 1" category="Work" time="18:00 to 23:30" badge="Due today" done="3" total="6" icon="flag" w="358" hint-size="358px,188px"></dc-import>
<div role="radiogroup" aria-label="Status" style="display: flex; gap: 8px">
<x-import component-from-global-scope="Zen.Chip">Todo</x-import>
<x-import component-from-global-scope="Zen.Chip" selected="{{yes}}" icon="play">In progress</x-import>
<x-import component-from-global-scope="Zen.Chip">Done</x-import>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; padding: 16px; border-radius: 20px; background: var(--surface)">
<x-import component-from-global-scope="Zen.Input" id="p-start" label="Start" default-value="Today" trailing-icon="calendar"></x-import>
<x-import component-from-global-scope="Zen.Input" id="p-due" label="Due" default-value="Today, 23:59" trailing-icon="flag"></x-import>
<x-import component-from-global-scope="Zen.Input" id="p-folder" label="Folder" default-value="Work" trailing-icon="chevronDown"></x-import>
<x-import component-from-global-scope="Zen.Input" id="p-prio" label="Priority" default-value="High" trailing-icon="chevronDown"></x-import>
</div>
<div style="padding: 0 4px">
<x-import component-from-global-scope="Zen.Switch" label="Remind me at 18:00" icon="bell" default-checked="{{yes}}"></x-import>
</div>
<section aria-labelledby="pst-h" style="display: flex; flex-direction: column; gap: 4px; padding: 16px; border-radius: 20px; background: var(--surface)">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px">
<h2 id="pst-h" style="margin: 0; font-size: 15px; font-weight: 600">Subtasks</h2>
<span style="font-size: 13px; font-weight: 600; color: var(--accent-ink)">3 of 6</span>
</div>
<sc-for list="{{subtasks}}" as="s" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<button type="button" role="checkbox" aria-checked="{{s.done}}" aria-label="{{s.label}}" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid {{s.border}}; background: {{s.bg}}; color: var(--on-accent); display: grid; place-items: center; cursor: pointer; padding: 0">
<sc-if value="{{s.done}}" hint-placeholder-val="{{no}}"><x-import component-from-global-scope="Zen.Icon" name="check" size="{{s14}}" stroke-width="{{bold}}"></x-import></sc-if>
</button>
<span style="font-size: 14px; line-height: 20px; color: {{s.color}}; text-decoration: {{s.deco}}">{{s.label}}</span>
</div>
</sc-for>
<button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0; border: 0; background: transparent; color: var(--ink-muted); font-family: var(--font-sans); font-size: 14px; cursor: pointer"><x-import component-from-global-scope="Zen.Icon" name="plus" size="{{s18}}"></x-import>Add subtask</button>
</section>
<section aria-labelledby="pnt-h" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="pnt-h" style="margin: 0; font-size: 15px; font-weight: 600">Notes</h2>
<a href="PhoneNotes.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 13px; font-weight: 600; color: var(--accent-ink); text-decoration: none">New note</a>
</div>
<dc-import name="NoteCard" tone="butter" heading="Stage 1 checklist" body="{{note}}" pinned="{{yes}}" linked="" updated="Edited 10 minutes ago" w="358" h="150" hint-size="358px,150px"></dc-import>
</section>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted)"><x-import component-from-global-scope="Zen.Icon" name="check" size="{{s14}}"></x-import>Saved</span>
<x-import component-from-global-scope="Zen.Button" variant="danger" size="sm" icon="trash">Delete task</x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (label, done) => ({ label: label, done: done, border: done ? 'var(--accent)' : 'var(--line-strong)', bg: done ? 'var(--accent)' : 'transparent', color: done ? 'var(--ink-muted)' : 'var(--ink)', deco: done ? 'line-through' : 'none' });
    return {
      yes: true, no: false, s14: 14, s18: 18, s20: 20, bold: 3,
      note: 'Deadline 11:59pm.\nConfirm the form link in announcements.\nTest the live URL before submitting.',
      subtasks: [
        mk('Build the design system', true),
        mk('Write the PRD', true),
        mk('Design all screens', true),
        mk('Build the app with AI', false),
        mk('Write endpoint tests', false),
        mk('Deploy and submit on Zedu', false)
      ]
    };
  }
}
</script>
</body>
</html>
