<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zen/tokens.css">
<link rel="stylesheet" href="ds/zen/components/bundle.css">
<script src="ds/zen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="dark" style="position: relative; width: 390px; height: 1240px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<main style="box-sizing: border-box; padding: 16px 16px 104px; display: flex; flex-direction: column; gap: 12px">
<header style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<h1 class="display" style="margin: 0">Tasks</h1>
<div style="display: flex; gap: 8px">
<button type="button" aria-label="Search tasks" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0"><x-import component-from-global-scope="Zen.Icon" name="search" size="{{s20}}"></x-import></button>
<button type="button" aria-label="Filters" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; cursor: pointer; padding: 0"><x-import component-from-global-scope="Zen.Icon" name="sliders" size="{{s20}}"></x-import></button>
</div>
</header>
<div role="group" aria-label="Filter tasks" style="display: flex; gap: 8px; overflow-x: auto; margin-right: -16px; padding: 4px 16px 4px 0">
<x-import component-from-global-scope="Zen.Chip" selected="{{yes}}">All</x-import>
<x-import component-from-global-scope="Zen.Chip">Work</x-import>
<x-import component-from-global-scope="Zen.Chip">Study</x-import>
<x-import component-from-global-scope="Zen.Chip">Personal</x-import>
<x-import component-from-global-scope="Zen.Chip">Health</x-import>
</div>
<h2 style="margin: 8px 0 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--danger)"><x-import component-from-global-scope="Zen.Icon" name="flag" size="{{s16}}"></x-import>Overdue <span style="color: var(--ink-muted); font-weight: 500">1</span></h2>
<x-import component-from-global-scope="Zen.TaskItem" title="Send invoice to client" time="Due yesterday" category="Work"></x-import>
<h2 style="margin: 8px 0 0; font-size: 13px; font-weight: 600">Today <span style="color: var(--ink-muted); font-weight: 500">4</span></h2>
<x-import component-from-global-scope="Zen.TaskItem" title="Submit HNG Stage 1" time="18:00 to 23:30" category="Work" has-note="{{yes}}"></x-import>
<x-import component-from-global-scope="Zen.TaskItem" title="Design review with the team" time="11:00 to 12:00" category="Work" has-note="{{yes}}"></x-import>
<x-import component-from-global-scope="Zen.TaskItem" title="Buy groceries" time="17:30" category="Personal"></x-import>
<x-import component-from-global-scope="Zen.TaskItem" title="Read 20 pages of Atomic Habits" time="21:00 to 21:30" category="Study"></x-import>
<h2 style="margin: 8px 0 0; font-size: 13px; font-weight: 600">Tomorrow <span style="color: var(--ink-muted); font-weight: 500">2</span></h2>
<x-import component-from-global-scope="Zen.TaskItem" title="Call mum" time="17:00" category="Personal"></x-import>
<x-import component-from-global-scope="Zen.TaskItem" title="Prepare Stage 2 notes" category="Study"></x-import>
<h2 style="margin: 8px 0 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600"><x-import component-from-global-scope="Zen.Icon" name="inbox" size="{{s16}}"></x-import>Inbox <span style="color: var(--ink-muted); font-weight: 500">1</span></h2>
<x-import component-from-global-scope="Zen.TaskItem" title="Plan portfolio redesign" has-note="{{yes}}"></x-import>
<button type="button" aria-expanded="false" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px 0 4px; border: 0; background: transparent; color: var(--ink-muted); font-family: var(--font-sans); font-size: 13px; font-weight: 600; cursor: pointer"><x-import component-from-global-scope="Zen.Icon" name="chevronRight" size="{{s18}}"></x-import>Completed 4</button>
</main>
<x-import component-from-global-scope="Zen.AppNav" layout="bar" active="tasks" items="{{items}}" style="position: absolute; left: 0; bottom: 0; width: 390px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      yes: true, s16: 16, s18: 18, s20: 20,
      items: [
        { id: 'home', label: 'Home', icon: 'home', href: 'PhoneHome.dc.html' },
        { id: 'tasks', label: 'Tasks', icon: 'tasks', href: 'PhoneTasks.dc.html' },
        { id: 'add', label: 'Add', icon: 'plus' },
        { id: 'notes', label: 'Notes', icon: 'note', href: 'PhoneNotes.dc.html' },
        { id: 'habits', label: 'Habits', icon: 'flame' }
      ]
    };
  }
}
</script>
</body>
</html>
