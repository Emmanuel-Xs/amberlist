<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks empty, tablet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zen/tokens.css">
<link rel="stylesheet" href="ds/zen/components/bundle.css">
<script src="ds/zen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="dark" style="position: relative; width: 820px; height: 1180px; display: flex; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<x-import component-from-global-scope="Zen.AppNav" layout="rail" active="tasks" items="{{items}}" style="height: 1180px; flex-shrink: 0"></x-import>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px">
<h1 class="display" style="margin: 0">Tasks</h1>
<dc-import name="QuickAdd" w="684" filled="{{no}}" hint-size="684px,56px"></dc-import>
<div style="margin-top: 48px">
<x-import component-from-global-scope="Zen.EmptyState" illustration="tasks" title="No tasks yet" text="Type one above and press Enter. Try &quot;Read 20 pages tomorrow #study&quot;."></x-import>
</div>
</main>
<x-import component-from-global-scope="Zen.Toast" icon="trash" message="Task deleted" action-label="Undo" style="position: absolute; left: 112px; bottom: 24px; width: 380px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return { no: false, items: [
      { id: 'home', label: 'Home', icon: 'home', href: 'TabletHome.dc.html' },
      { id: 'tasks', label: 'Tasks', icon: 'tasks', href: 'TabletTasks.dc.html' },
      { id: 'notes', label: 'Notes', icon: 'note', href: 'TabletNotes.dc.html' },
      { id: 'habits', label: 'Habits', icon: 'flame' },
      { id: 'folders', label: 'Folders', icon: 'folder' }
    ] };
  }
}
</script>
</body>
</html>
