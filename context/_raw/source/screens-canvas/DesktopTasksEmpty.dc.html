<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks empty, desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zen/tokens.css">
<link rel="stylesheet" href="ds/zen/components/bundle.css">
<script src="ds/zen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="dark" style="position: relative; width: 1440px; height: 1024px; display: flex; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<dc-import name="Sidebar" active="tasks" h="1024" fresh="{{yes}}" hint-size="256px,1024px"></dc-import>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 16px">
<h1 class="display" style="margin: 0">Tasks</h1>
<div style="width: 720px; align-self: center; display: flex; flex-direction: column; gap: 16px; margin-top: 24px">
<dc-import name="QuickAdd" w="720" filled="{{no}}" hint-size="720px,56px"></dc-import>
<div style="margin-top: 48px">
<x-import component-from-global-scope="Zen.EmptyState" illustration="tasks" title="No tasks yet" text="Type one above and press Enter. Try &quot;Read 20 pages tomorrow #study&quot;."></x-import>
</div>
</div>
</main>
<x-import component-from-global-scope="Zen.Toast" icon="trash" message="Task deleted" action-label="Undo" style="position: absolute; left: 288px; bottom: 32px; width: 380px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1024}}'>
class Component extends DCLogic {
  renderVals() {
    return { yes: true, no: false };
  }
}
</script>
</body>
</html>
