<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home loading, phone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zen/tokens.css">
<link rel="stylesheet" href="ds/zen/components/bundle.css">
<script src="ds/zen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="dark" style="position: relative; width: 390px; height: 844px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<main aria-busy="true" aria-label="Loading your day" style="box-sizing: border-box; padding: 16px 16px 104px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<span style="font-size: 20px; font-weight: 700">Amberlist</span>
<x-import component-from-global-scope="Zen.Skeleton" width="44px" height="44px" radius="50%"></x-import>
</header>
<div style="display: flex; flex-direction: column; gap: 10px">
<x-import component-from-global-scope="Zen.Skeleton" width="150px" height="14px"></x-import>
<x-import component-from-global-scope="Zen.Skeleton" width="280px" height="28px" radius="10px"></x-import>
</div>
<x-import component-from-global-scope="Zen.Skeleton" width="100%" height="56px" radius="9999px"></x-import>
<div style="display: flex; gap: 8px">
<sc-for list="{{six}}" as="d" hint-placeholder-count="6"><x-import component-from-global-scope="Zen.Skeleton" width="48px" height="64px" radius="9999px"></x-import></sc-for>
</div>
<x-import component-from-global-scope="Zen.Skeleton" width="100%" height="188px" radius="28px"></x-import>
<x-import component-from-global-scope="Zen.Skeleton" width="100%" height="188px" radius="28px"></x-import>
</main>
<x-import component-from-global-scope="Zen.AppNav" layout="bar" active="home" items="{{items}}" style="position: absolute; left: 0; bottom: 0; width: 390px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      six: [1, 2, 3, 4, 5, 6],
      items: [
        { id: 'home', label: 'Home', icon: 'home' },
        { id: 'tasks', label: 'Tasks', icon: 'tasks' },
        { id: 'add', label: 'Add', icon: 'plus' },
        { id: 'notes', label: 'Notes', icon: 'note' },
        { id: 'habits', label: 'Habits', icon: 'flame' }
      ]
    };
  }
}
</script>
</body>
</html>
