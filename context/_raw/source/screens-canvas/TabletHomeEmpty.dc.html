<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, tablet, first visit</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zen/tokens.css">
<link rel="stylesheet" href="ds/zen/components/bundle.css">
<script src="ds/zen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="dark" style="width: 820px; height: 1180px; display: flex; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<x-import component-from-global-scope="Zen.AppNav" layout="rail" active="home" items="{{items}}" style="height: 1180px; flex-shrink: 0"></x-import>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; justify-content: flex-end"><a href="TabletProfile.dc.html" aria-label="Profile, you are a guest" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; text-decoration: none">E</a></div>
<div style="display: flex; flex-direction: column; gap: 4px">
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted)">Good evening</p>
<h1 class="display" style="margin: 0">Let's plan your day.</h1>
</div>
<dc-import name="QuickAdd" w="684" filled="{{no}}" hint-size="684px,56px"></dc-import>
<div style="border-radius: 28px; background: var(--surface)">
<x-import component-from-global-scope="Zen.EmptyState" illustration="tasks" title="Add your first task" text="Type it above and press Enter. Try &quot;Read 20 pages tomorrow #study&quot; and we'll set the date and folder for you."></x-import>
</div>
<div style="display: flex; gap: 24px">
<a href="#" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 13px; font-weight: 600; color: var(--accent-ink); text-decoration: none"><x-import component-from-global-scope="Zen.Icon" name="plus" size="{{s16}}"></x-import>Add a habit</a>
<a href="#" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 13px; font-weight: 600; color: var(--accent-ink); text-decoration: none"><x-import component-from-global-scope="Zen.Icon" name="plus" size="{{s16}}"></x-import>New folder</a>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    return { no: false, s16: 16, items: [
      { id: 'home', label: 'Home', icon: 'home', href: 'TabletHome.dc.html' },
      { id: 'tasks', label: 'Tasks', icon: 'tasks', href: 'TabletTasks.dc.html' },
      { id: 'notes', label: 'Notes', icon: 'note', href: 'TabletNotes.dc.html' },
      { id: 'habits', label: 'Habits', icon: 'flame' },
      { id: 'folders', label: 'Folders', icon: 'folder' }
    ] };
  }
}
</script>

</html>
