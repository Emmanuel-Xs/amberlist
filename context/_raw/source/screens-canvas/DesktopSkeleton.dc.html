<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home loading, desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zen/tokens.css">
<link rel="stylesheet" href="ds/zen/components/bundle.css">
<script src="ds/zen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="dark" style="width: 1440px; height: 1024px; display: flex; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<dc-import name="Sidebar" active="home" h="1024" hint-size="256px,1024px"></dc-import>
<main aria-busy="true" aria-label="Loading your day" style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 10px">
<x-import component-from-global-scope="Zen.Skeleton" width="180px" height="14px"></x-import>
<x-import component-from-global-scope="Zen.Skeleton" width="420px" height="34px" radius="12px"></x-import>
</div>
<div style="display: flex; gap: 12px">
<x-import component-from-global-scope="Zen.Skeleton" width="340px" height="52px" radius="9999px"></x-import>
<x-import component-from-global-scope="Zen.Skeleton" width="104px" height="48px" radius="9999px"></x-import>
</div>
</header>
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 20px">
<x-import component-from-global-scope="Zen.Skeleton" width="100%" height="56px" radius="9999px"></x-import>
<div style="display: flex; justify-content: space-between">
<sc-for list="{{seven}}" as="d" hint-placeholder-count="7"><x-import component-from-global-scope="Zen.Skeleton" width="56px" height="64px" radius="9999px"></x-import></sc-for>
</div>
<x-import component-from-global-scope="Zen.Skeleton" width="80px" height="18px"></x-import>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{four}}" as="c" hint-placeholder-count="4"><x-import component-from-global-scope="Zen.Skeleton" width="100%" height="188px" radius="28px"></x-import></sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<x-import component-from-global-scope="Zen.Skeleton" width="80px" height="18px"></x-import>
<sc-for list="{{three}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; height: 72px; padding: 0 14px; border-radius: 20px; background: var(--surface)">
<x-import component-from-global-scope="Zen.Skeleton" width="44px" height="44px" radius="50%"></x-import>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
<x-import component-from-global-scope="Zen.Skeleton" width="70%" height="14px"></x-import>
<x-import component-from-global-scope="Zen.Skeleton" width="40%" height="10px"></x-import>
</div>
</div>
</sc-for>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1024}}'>
class Component extends DCLogic {
  renderVals() { return { seven: [1, 2, 3, 4, 5, 6, 7], four: [1, 2, 3, 4], three: [1, 2, 3] }; }
}
</script>
</body>
</html>
