<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks, desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zen/tokens.css">
<link rel="stylesheet" href="ds/zen/components/bundle.css">
<script src="ds/zen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="dark" style="width: 1440px; height: 1024px; display: flex; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<dc-import name="Sidebar" active="tasks" h="1024" hint-size="256px,1024px"></dc-import>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: baseline; gap: 12px">
<h1 class="display" style="margin: 0">Tasks</h1>
<span style="font-size: 14px; color: var(--ink-muted)">9 open</span>
</div>
<x-import component-from-global-scope="Zen.SearchBar" placeholder="Search tasks" style="width: 280px"></x-import>
</header>
<dc-import name="QuickAdd" w="740" filled="{{yes}}" hint-size="740px,98px"></dc-import>
<div role="group" aria-label="Filter tasks" style="display: flex; gap: 8px; flex-wrap: wrap">
<x-import component-from-global-scope="Zen.Chip" selected="{{yes}}">All</x-import>
<x-import component-from-global-scope="Zen.Chip">Work</x-import>
<x-import component-from-global-scope="Zen.Chip">Study</x-import>
<x-import component-from-global-scope="Zen.Chip">Personal</x-import>
<x-import component-from-global-scope="Zen.Chip" icon="flag">High priority</x-import>
</div>
<section aria-labelledby="g-over" style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
<h2 id="g-over" style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--danger)"><x-import component-from-global-scope="Zen.Icon" name="flag" size="{{s16}}"></x-import>Overdue <span style="color: var(--ink-muted); font-weight: 500">1</span></h2>
<x-import component-from-global-scope="Zen.TaskItem" title="Send invoice to client" time="Due yesterday" category="Work"></x-import>
</section>
<section aria-labelledby="g-today" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="g-today" style="margin: 0; font-size: 13px; font-weight: 600; color: var(--ink)">Today <span style="color: var(--ink-muted); font-weight: 500">4</span></h2>
<x-import component-from-global-scope="Zen.TaskItem" title="Submit HNG Stage 1" time="18:00 to 23:30" category="Work" has-note="{{yes}}" selected="{{sel}}"></x-import>
<x-import component-from-global-scope="Zen.TaskItem" title="Design review with the team" time="11:00 to 12:00" category="Work" has-note="{{yes}}"></x-import>
<x-import component-from-global-scope="Zen.TaskItem" title="Buy groceries" time="17:30" category="Personal"></x-import>
<x-import component-from-global-scope="Zen.TaskItem" title="Read 20 pages of Atomic Habits" time="21:00 to 21:30" category="Study"></x-import>
</section>
<section aria-labelledby="g-tom" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="g-tom" style="margin: 0; font-size: 13px; font-weight: 600; color: var(--ink)">Tomorrow <span style="color: var(--ink-muted); font-weight: 500">2</span></h2>
<x-import component-from-global-scope="Zen.TaskItem" title="Call mum" time="17:00" category="Personal"></x-import>
<x-import component-from-global-scope="Zen.TaskItem" title="Prepare Stage 2 notes" category="Study"></x-import>
</section>
<section aria-labelledby="g-inbox" style="display: flex; flex-direction: column; gap: 8px">
<h2 id="g-inbox" style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink)"><x-import component-from-global-scope="Zen.Icon" name="inbox" size="{{s16}}"></x-import>Inbox <span style="color: var(--ink-muted); font-weight: 500">2</span></h2>
<x-import component-from-global-scope="Zen.TaskItem" title="Plan portfolio redesign" has-note="{{yes}}"></x-import>
</section>
<button type="button" aria-expanded="false" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px 0 4px; border: 0; background: transparent; color: var(--ink-muted); font-family: var(--font-sans); font-size: 13px; font-weight: 600; cursor: pointer"><x-import component-from-global-scope="Zen.Icon" name="chevronRight" size="{{s18}}"></x-import>Completed 4</button>
</main>
<sc-if value="{{sel}}" hint-placeholder-val="{{yes}}">
<aside aria-label="Task details" style="width: 380px; flex-shrink: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 20px; background: var(--surface); border-left: 1px solid var(--line); overflow: hidden">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 13px; font-weight: 500; color: var(--ink-muted)">Task details</span>
<div style="display: flex; gap: 4px">
<button type="button" aria-label="More actions" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0"><x-import component-from-global-scope="Zen.Icon" name="more" size="{{s20}}"></x-import></button>
<button type="button" aria-label="Close details" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0"><x-import component-from-global-scope="Zen.Icon" name="x" size="{{s20}}"></x-import></button>
</div>
</div>
<input aria-label="Task title" readonly="{{yes}}" value="Submit HNG Stage 1" style="font-family: var(--font-sans); font-size: 22px; line-height: 30px; font-weight: 600; color: var(--ink); background: transparent; border: 0; padding: 0; outline: 0">
<div role="radiogroup" aria-label="Status" style="display: flex; gap: 8px">
<x-import component-from-global-scope="Zen.Chip">Todo</x-import>
<x-import component-from-global-scope="Zen.Chip" selected="{{yes}}" icon="play">In progress</x-import>
<x-import component-from-global-scope="Zen.Chip">Done</x-import>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px">
<x-import component-from-global-scope="Zen.Input" id="d-start" label="Start" default-value="Today" trailing-icon="calendar"></x-import>
<x-import component-from-global-scope="Zen.Input" id="d-due" label="Due" default-value="Today, 23:59" trailing-icon="flag"></x-import>
<x-import component-from-global-scope="Zen.Input" id="d-time" label="Time" default-value="18:00 to 23:30" trailing-icon="clock"></x-import>
<x-import component-from-global-scope="Zen.Input" id="d-folder" label="Folder" default-value="Work" trailing-icon="chevronDown"></x-import>
</div>
<section aria-labelledby="st-h" style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px">
<h2 id="st-h" style="margin: 0; font-size: 15px; font-weight: 600">Subtasks</h2>
<span style="font-size: 13px; font-weight: 600; color: var(--accent-ink)">3 of 6</span>
</div>
<div role="progressbar" aria-label="Subtasks done" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" style="height: 6px; border-radius: 9999px; background: var(--surface-raised); overflow: hidden; margin-bottom: 6px"><div style="width: 50%; height: 100%; background: var(--accent); border-radius: 9999px"></div></div>
<sc-for list="{{subtasks}}" as="s" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; min-height: 38px">
<button type="button" role="checkbox" aria-checked="{{s.done}}" aria-label="{{s.label}}" style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; border: 1.5px solid {{s.border}}; background: {{s.bg}}; color: var(--on-accent); display: grid; place-items: center; cursor: pointer; padding: 0">
<sc-if value="{{s.done}}" hint-placeholder-val="{{no}}"><x-import component-from-global-scope="Zen.Icon" name="check" size="{{s14}}" stroke-width="{{bold}}"></x-import></sc-if>
</button>
<span style="font-size: 14px; line-height: 20px; color: {{s.color}}; text-decoration: {{s.deco}}">{{s.label}}</span>
</div>
</sc-for>
<button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0; border: 0; background: transparent; color: var(--ink-muted); font-family: var(--font-sans); font-size: 14px; cursor: pointer"><x-import component-from-global-scope="Zen.Icon" name="plus" size="{{s18}}"></x-import>Add subtask</button>
</section>
<section aria-labelledby="nt-h" style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 id="nt-h" style="margin: 0; font-size: 15px; font-weight: 600">Notes</h2>
<a href="DesktopNotes.dc.html" style="font-size: 13px; font-weight: 600; color: var(--accent-ink); text-decoration: none">New note</a>
</div>
<div style="padding: 14px 16px; border-radius: 16px; background: var(--surface-raised); display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 600">Stage 1 checklist</span>
<span style="font-size: 13px; line-height: 19px; color: var(--ink-muted)">Deadline 11:59pm. Confirm the form link in announcements before submitting.</span>
</div>
</section>
<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-muted)"><x-import component-from-global-scope="Zen.Icon" name="check" size="{{s14}}"></x-import>Saved</span>
<x-import component-from-global-scope="Zen.Button" variant="danger" size="sm" icon="trash">Delete</x-import>
</div>
</aside>
</sc-if>
<sc-if value="{{nosel}}" hint-placeholder-val="{{no}}">
<aside aria-label="Task details" style="width: 380px; flex-shrink: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; justify-content: center; background: var(--surface); border-left: 1px solid var(--line)">
<x-import component-from-global-scope="Zen.EmptyState" illustration="tasks" title="Pick a task" text="Select a task to see its dates, subtasks and notes here. Press Q to add a new one."></x-import>
</aside>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"selected":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":1024}}'>
class Component extends DCLogic {
  renderVals() {
    const mk = (label, done) => ({ label: label, done: done, border: done ? 'var(--accent)' : 'var(--line-strong)', bg: done ? 'var(--accent)' : 'transparent', color: done ? 'var(--ink-muted)' : 'var(--ink)', deco: done ? 'line-through' : 'none' });
    const sel = !(this.props.selected === false || this.props.selected === 'false');
    return {
      sel: sel, nosel: !sel,
      yes: true, no: false, s14: 14, s16: 16, s18: 18, s20: 20, bold: 3,
      subtasks: [
        mk('Build the design system', true),
        mk('Write the PRD', true),
        mk('Design all screens', true),
        mk('Build the app with AI', false),
        mk('Write endpoint tests', false),
        mk('Deploy and submit on Zedu', false)
      ]
    };
  }
}
</script>
</body>
</html>
