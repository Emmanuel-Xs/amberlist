<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes, desktop</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zen/tokens.css">
<link rel="stylesheet" href="ds/zen/components/bundle.css">
<script src="ds/zen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="dark" style="width: 1440px; height: 1024px; display: flex; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<dc-import name="Sidebar" active="notes" h="1024" scratch="{{yes}}" hint-size="256px,1024px"></dc-import>
<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 32px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
<header style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
<h1 class="display" style="margin: 0">Notes</h1>
<div style="display: flex; align-items: center; gap: 12px">
<x-import component-from-global-scope="Zen.SearchBar" placeholder="Search notes" on-filter="{{none}}" style="width: 240px"></x-import>
<x-import component-from-global-scope="Zen.Button" icon="plus">New note</x-import>
</div>
</header>
<h2 style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600"><x-import component-from-global-scope="Zen.Icon" name="pin" size="{{s16}}"></x-import>Pinned</h2>
<div style="display: flex; gap: 16px">
<dc-import name="NoteCard" tone="butter" heading="Stage 1 checklist" body="{{n1}}" pinned="{{yes}}" linked="Submit HNG Stage 1" w="362" h="184" hint-size="362px,184px"></dc-import>
<dc-import name="NoteCard" tone="lavender" heading="Reading list" body="{{n2}}" pinned="{{yes}}" linked="" updated="Edited yesterday" w="362" h="184" hint-size="362px,184px"></dc-import>
</div>
<h2 style="margin: 8px 0 0; font-size: 13px; font-weight: 600">All notes <span style="color: var(--ink-muted); font-weight: 500">8</span></h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px">
<dc-import name="NoteCard" tone="surface" heading="Design review notes" body="{{n3}}" pinned="{{no}}" linked="Design review with the team" w="236" h="196" hint-size="236px,196px"></dc-import>
<dc-import name="NoteCard" tone="mint" heading="Groceries" body="{{n4}}" pinned="{{no}}" linked="Buy groceries" w="236" h="196" hint-size="236px,196px"></dc-import>
<dc-import name="NoteCard" tone="surface" heading="Stage 2 ideas" body="{{n5}}" pinned="{{no}}" linked="" updated="Edited 2 days ago" w="236" h="196" hint-size="236px,196px"></dc-import>
<dc-import name="NoteCard" tone="sky" heading="Portfolio" body="{{n6}}" pinned="{{no}}" linked="Plan portfolio redesign" w="236" h="196" hint-size="236px,196px"></dc-import>
<dc-import name="NoteCard" tone="peach" heading="Client call" body="{{n7}}" pinned="{{no}}" linked="Send invoice to client" w="236" h="196" hint-size="236px,196px"></dc-import>
<dc-import name="NoteCard" tone="surface" heading="Workout plan" body="{{n8}}" pinned="{{no}}" linked="" updated="Edited last week" w="236" h="196" hint-size="236px,196px"></dc-import>
</div>
</main>
<aside aria-label="Scratchpad" style="width: 380px; flex-shrink: 0; box-sizing: border-box; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: var(--surface); border-left: 1px solid var(--line); overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center"><x-import component-from-global-scope="Zen.Icon" name="scratch" size="{{s20}}"></x-import></span>
<h2 class="title" style="margin: 0; flex-grow: 1">Scratchpad</h2>
<span style="font-size: 12px; color: var(--ink-muted)">Saved</span>
<button type="button" aria-label="Close scratchpad" style="width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; padding: 0"><x-import component-from-global-scope="Zen.Icon" name="x" size="{{s20}}"></x-import></button>
</div>
<p style="margin: 0; font-size: 13px; line-height: 19px; color: var(--ink-muted)">Dump anything here. Hover a line to turn it into a task or a note.</p>
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 12px; background: {{l.bg}}">
<span style="font-size: 15px; line-height: 22px">{{l.text}}</span>
<sc-if value="{{l.hover}}" hint-placeholder-val="{{no}}">
<div style="display: flex; gap: 8px">
<x-import component-from-global-scope="Zen.Button" size="sm" icon="tasks">Make task</x-import>
<x-import component-from-global-scope="Zen.Button" size="sm" variant="outline" icon="note">Make note</x-import>
</div>
</sc-if>
</div>
</sc-for>
<div style="display: flex; align-items: center; gap: 2px; padding: 10px 12px; font-size: 15px; line-height: 22px; color: var(--ink-muted)"><span style="width: 2px; height: 20px; background: var(--accent)"></span><span style="margin-left: 4px">Type a thought</span></div>
</div>
<div style="flex-grow: 1"></div>
<p style="margin: 0; font-size: 12px; color: var(--ink-muted)">Press <kbd style="font-family: var(--font-sans); border: 1px solid var(--line-strong); border-radius: 6px; padding: 0 6px">N</kbd> anywhere to open the scratchpad.</p>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1024}}'>
class Component extends DCLogic {
  renderVals() {
    const line = (text, hover) => ({ text: text, hover: hover, bg: hover ? 'var(--surface-raised)' : 'transparent' });
    return {
      yes: true, no: false, none: null, s16: 16, s20: 20,
      n1: 'Tasks with dates and subtasks\nNotes and the scratchpad\nEndpoint tests passing\nDeploy, then submit on Zedu',
      n2: 'Atomic Habits\nDeep Work\nThe Design of Everyday Things',
      n3: 'Keep amber for fills only.\nFolder tabs need more contrast in light mode.',
      n4: 'Rice, eggs, tomatoes, plantain, bread, milk',
      n5: 'Habits with streaks\nGoogle sign in\nReminders\nRepeating tasks',
      n6: 'Add the Amberlist case study.\nNew hero photo.',
      n7: 'Invoice sent Monday. Follow up if unpaid by Friday.',
      n8: 'Mon, Wed, Fri: 5km run\nTue, Thu: strength',
      lines: [
        line('Ask the team about the Stage 2 brief', false),
        line('Streak freeze for habits?', false),
        line('Call the bank before Friday', true),
        line('Portfolio: add Amberlist case study', false),
        line('Buy printer ink', false),
        line('Try Groq for the AI breakdown later', false)
      ]
    };
  }
}
</script>
</body>
</html>
