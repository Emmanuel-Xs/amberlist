<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home, phone, first visit</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/zen/tokens.css">
<link rel="stylesheet" href="ds/zen/components/bundle.css">
<script src="ds/zen/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div data-theme="dark" style="position: relative; width: 390px; height: 844px; background: var(--bg); color: var(--ink); font-family: var(--font-sans); overflow: hidden">
<main style="box-sizing: border-box; padding: 16px 16px 104px; display: flex; flex-direction: column; gap: 20px">
<header style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<span style="font-size: 20px; font-weight: 700">Amberlist</span>
<a href="PhoneProfile.dc.html" aria-label="Profile, you are a guest" style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface); color: var(--ink); display: grid; place-items: center"><x-import component-from-global-scope="Zen.Icon" name="user" size="{{s20}}"></x-import></a>
</header>
<div style="display: flex; flex-direction: column; gap: 4px; margin-top: 24px">
<p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--ink-muted)">Good evening</p>
<h1 class="display" style="margin: 0">Let's plan your day.</h1>
</div>
<dc-import name="QuickAdd" w="358" filled="{{no}}" hint-size="358px,56px"></dc-import>
<div style="border-radius: 28px; background: var(--surface)">
<x-import component-from-global-scope="Zen.EmptyState" illustration="tasks" title="Add your first task" text="Type it above and press Enter. Try &quot;Read 20 pages tomorrow #study&quot; and we'll set the date and folder for you."></x-import>
</div>
<div style="display: flex; gap: 20px; margin-top: 8px">
<a href="#" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 13px; font-weight: 600; color: var(--accent-ink); text-decoration: none"><x-import component-from-global-scope="Zen.Icon" name="plus" size="{{s16}}"></x-import>Add a habit</a>
<a href="#" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 13px; font-weight: 600; color: var(--accent-ink); text-decoration: none"><x-import component-from-global-scope="Zen.Icon" name="plus" size="{{s16}}"></x-import>New folder</a>
</div>
</main>
<x-import component-from-global-scope="Zen.AppNav" layout="bar" active="home" items="{{items}}" style="position: absolute; left: 0; bottom: 0; width: 390px"></x-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      no: false, s16: 16, s20: 20,
      items: [
        { id: 'home', label: 'Home', icon: 'home' },
        { id: 'tasks', label: 'Tasks', icon: 'tasks' },
        { id: 'add', label: 'Add', icon: 'plus' },
        { id: 'notes', label: 'Notes', icon: 'note' },
        { id: 'habits', label: 'Habits', icon: 'flame' }
      ]
    };
  }
}
</script>
</body>
</html>
