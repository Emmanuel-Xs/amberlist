<!doctype html>
<html>
<head><meta charset="utf-8"><title>Icon</title></head>
<body>
<div id="root" style="padding:16px;display:grid;grid-template-columns:repeat(8,1fr);gap:16px 8px"></div>
<script>
var Z = window.Zen, h = React.createElement;
var names = ['home','tasks','note','flame','folder','plus','search','sliders','more','x','calendar','clock','flag','bell','inbox','check','play','pin','link','scratch','trash','alert','refresh','undo','download','copy','logout','arrowLeft','chevronRight','chevronDown','user','moon','sun','book','pen','droplet','target','cart','menu'];
ReactDOM.createRoot(document.getElementById('root')).render(names.map(function(n){ return h('div',{key:n,style:{display:'flex',flexDirection:'column',alignItems:'center',gap:6,fontSize:11,color:'var(--ink-muted)'}}, h('span',{style:{color:'var(--ink)'}}, h(Z.Icon,{name:n,size:24})), n); }));
</script>
</body>
</html>
